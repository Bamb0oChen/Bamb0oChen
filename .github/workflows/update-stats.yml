name: Update profile statistics

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - scripts/generate_cards.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current public repository statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_cards.py
      - name: Commit updated snapshot
        run: |
          git add README.md assets/stats
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile statistics'
          git push
